name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customers_test

    steps:
      - name: Fetch the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create the tables
        run: psql "$DATABASE_URL" -f db/schema.sql

      - name: Run the tests
        run: python -m pytest

      - name: Package the app
        run: zip -r api.zip app db requirements.txt -x "*/__pycache__/*"

      - name: Save the package
        uses: actions/upload-artifact@v5
        with:
          name: api-package
          path: api.zip

  deploy-test:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download the package
        uses: actions/download-artifact@v5
        with:
          name: api-package

      - name: Unpack the package
        run: unzip api.zip -d package

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Open the database door for this runner
        run: |
          IP=$(curl -s https://api.ipify.org)
          az postgres flexible-server firewall-rule create --resource-group rg-customers-test --server-name pg-cust-marwan-denmarkeast --name ci-runner --start-ip-address $IP --end-ip-address $IP

      - name: Update the tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -f package/db/schema.sql

      - name: Deploy to the Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-customers-marwan-test
          package: api.zip

      - name: Check the app is healthy
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://app-customers-marwan-test.azurewebsites.net/health; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Close the database door
        if: always()
        run: az postgres flexible-server firewall-rule delete --resource-group rg-customers-test --server-name pg-cust-marwan-denmarkeast --name ci-runner --yes

  deploy-uat:
    needs: deploy-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: uat
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download the package
        uses: actions/download-artifact@v5
        with:
          name: api-package

      - name: Unpack the package
        run: unzip api.zip -d package

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Open the database door for this runner
        run: |
          IP=$(curl -s https://api.ipify.org)
          az postgres flexible-server firewall-rule create --resource-group rg-customers-test --server-name pg-cust-marwan-denmarkeast --name ci-runner --start-ip-address $IP --end-ip-address $IP

      - name: Update the tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -f package/db/schema.sql

      - name: Deploy to the Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-customers-marwan-uat
          package: api.zip

      - name: Check the app is healthy
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://app-customers-marwan-uat.azurewebsites.net/health; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Close the database door
        if: always()
        run: az postgres flexible-server firewall-rule delete --resource-group rg-customers-test --server-name pg-cust-marwan-denmarkeast --name ci-runner --yes

  deploy-production:
    needs: deploy-uat
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download the package
        uses: actions/download-artifact@v5
        with:
          name: api-package

      - name: Unpack the package
        run: unzip api.zip -d package

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Open the database door for this runner
        run: |
          IP=$(curl -s https://api.ipify.org)
          az postgres flexible-server firewall-rule create --resource-group rg-customers-test --server-name pg-cust-marwan-denmarkeast --name ci-runner --start-ip-address $IP --end-ip-address $IP

      - name: Update the tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -f package/db/schema.sql

      - name: Deploy to the Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-customers-marwan-prod
          package: api.zip

      - name: Check the app is healthy
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://app-customers-marwan-prod.azurewebsites.net/health; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Close the database door
        if: always()
        run: az postgres flexible-server firewall-rule delete --resource-group rg-customers-test --server-name pg-cust-marwan-denmarkeast --name ci-runner --yes
