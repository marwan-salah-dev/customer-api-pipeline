name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customers_test

    steps:
      - name: Fetch the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create the tables
        run: psql "$DATABASE_URL" -f db/schema.sql

      - name: Run the tests
        run: python -m pytest

      - name: Package the app
        run: zip -r api.zip app db requirements.txt -x "*/__pycache__/*"

      - name: Save the package
        uses: actions/upload-artifact@v5
        with:
          name: api-package
          path: api.zip
